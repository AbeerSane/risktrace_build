spring.application.name=risktrace
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/risktrace?sslmode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:MyNewSecurePass123!}

# Hibernate / JPA Configuration
# 'update' automatically creates/updates the schema when the app starts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Data Seeder Configuration (Automatically populates realistic sample disputes on boot)
risktrace.seed.enabled=${RISKTRACE_SEED_ENABLED:true}

# AI Configuration (Optional: Groq / OpenAI compatible LLM key. If omitted, built-in deterministic engine handles analysis)
risktrace.ai.api-url=${RISKTRACE_AI_API_URL:https://api.groq.com/openai/v1/chat/completions}
risktrace.ai.api-key=${GROQ_API_KEY:}
risktrace.ai.model=${RISKTRACE_AI_MODEL:llama-3.1-70b-versatile}

# Security Configuration
risktrace.api.key=${API_KEY:default-dev-key}
risktrace.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
