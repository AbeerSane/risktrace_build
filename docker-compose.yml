services:
  postgres:
    image: postgres:15-alpine
    container_name: risktrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: risktrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MyNewSecurePass123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d risktrace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
