<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0B0F19"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#shieldGrad)" fill-opacity="0.15" stroke="url(#shieldGrad)" stroke-width="2"/>

  <!-- Shield Shape -->
  <path d="M32 12L46 17V30C46 41.5 39.5 48.5 32 52C24.5 48.5 18 41.5 18 30V17L32 12Z" 
        fill="url(#shieldGrad)" 
        stroke="#DDD6FE" 
        stroke-width="2" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Checkmark / Telemetry Pulse -->
  <path d="M26 31.5L30 35.5L38.5 25.5" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>